[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vn-stock-rl"
version = "0.1.0"
description = "VN stock RL experiments consuming research-approved feature exports."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=0.29.0",
    "stable-baselines3>=2.0.0",
    "sb3-contrib>=2.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=12.0.0",
    "matplotlib>=3.7.0",
    "torch",
    "vnstock",
    "yfinance",
    "tensorboard",
    "dash>=2.18.0",
    "plotly>=5.24.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "sentence-transformers>=3.0.0",
    "PyYAML>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[project.scripts]
vn-stock-train = "vn_stock_rl.entrypoints:train_main"
vn-stock-evaluate = "vn_stock_rl.entrypoints:evaluate_main"
vn-stock-count-params = "vn_stock_rl.entrypoints:count_params_main"

[tool.setuptools.packages.find]
include = ["vn_stock_rl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
